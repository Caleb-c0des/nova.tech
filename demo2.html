  <script>
    const canvas = document.getElementById('c');
    const box = document.getElementById('gridbox');
    const ctx = canvas.getContext('2d');
    const STEP = 44;
    let t = 0;
    let scrollX = 0;

    function resize() {
      canvas.width = box.offsetWidth;
      canvas.height = box.offsetHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function draw() {
        
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const w = canvas.width, h = canvas.height;

      scrollX = (scrollX + 0.4) % STEP;

      ctx.lineWidth = 1;

      // Vertical lines scrolling horizontally
      for (let x = -STEP; x <= w + STEP * 2; x += STEP) {
        const rx = (x + scrollX) % (w + STEP);
        const shift = Math.sin(t * 0.5 + x * 0.015) * 5;
        ctx.strokeStyle = `rgba(30,140,255,${0.15 + 0.1 * Math.abs(Math.sin(t * 0.4 + x * 0.02))})`;
        ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(rx + shift, h); ctx.stroke();
      }

      // Horizontal lines
      for (let y = -STEP; y <= h + STEP; y += STEP) {
        const shift = Math.sin(t * 0.5 + y * 0.015) * 5;
        ctx.strokeStyle = `rgba(30,140,255,${0.15 + 0.1 * Math.abs(Math.sin(t * 0.4 + y * 0.02))})`;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y + shift); ctx.stroke();
      }

      // Glowing dots
      for (let x = -STEP; x <= w + STEP * 2; x += STEP) {
        for (let y = -STEP; y <= h + STEP; y += STEP) {
          const dx = ((x + scrollX) % (w + STEP)) + Math.sin(t * 0.5 + x * 0.015) * 5;
          const dy = y + Math.sin(t * 0.5 + y * 0.015) * 5;

          const distFromCenter = Math.sqrt(Math.pow((dx - w/2)/w, 2) + Math.pow((dy - h/2)/h, 2));
          const ripple = Math.sin(t * 1.5 - distFromCenter * 12);
          const alpha = 0.4 + ripple * 0.35;
          const size = 1.5 + ripple * 1.2;

          const grd = ctx.createRadialGradient(dx, dy, 0, dx, dy, 7);
          grd.addColorStop(0, `rgba(50,160,255,${Math.max(0, alpha * 0.6)})`);
          grd.addColorStop(1, 'rgba(0,100,255,0)');
          ctx.beginPath();
          ctx.arc(dx, dy, 7, 0, Math.PI * 2);
          ctx.fillStyle = grd;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(dx, dy, Math.max(0.5, size), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(120,200,255,${Math.max(0.1, alpha)})`;
          ctx.fill();
        }
      }

      t += 0.025;
      requestAnimationFrame(draw);
    } 
    draw();
  </script>
